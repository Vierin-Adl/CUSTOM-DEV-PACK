<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Responsive</title>
    <meta name="ad.labels" content="scroll_banner">
    <meta name="ad.optout" content="adlook">
    <meta name="ad.size" content="width=0,height=0">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Set destination URL -->
    <script>
        var clickTag = '';
    </script>

    <script>
        var adlView = {
            MIN_RATIO: 0.5,
            MIN_TIME: 1000
        }
    </script>

    <!-- Required framework scripts — do not edit -->
    <script src="./js/rtbh_enabler.js"></script>
    <script src="./js/app.js"></script>

    <!-- Creative sizes: add/remove entries to match your campaign -->
    <script>
        window.creativeConfig = [
            { key: "300x600", width: 300, height: 600 },
            { key: "320x480", width: 320, height: 480 },
            { key: "160x600", width: 160, height: 600 },
            { key: "336x280", width: 336, height: 280 },
            { key: "300x250", width: 300, height: 250 },
            { key: "970x250", width: 970, height: 250 },
            { key: "970x90",  width: 970, height: 90  },
            { key: "728x90",  width: 728, height: 90  }
        ];

        window.creativeSettings = {
            viewportScrollOffsetRatio: 0.5, // 0 = top edge triggers, 0.5 = center, 1 = bottom edge
            feature: {
                enableClip: false,
                enableViewportScroll: true  // must be true for scroll-driven animation
            }
        };
    </script>
</head>

<body>
    <!-- Framework wrappers — do not edit -->
    <div class="inread-root" data-item="inread-root">
        <div class="inread-scroller" data-item="inread-content">
            <div class="banner__click_area" data-action="click"></div>

            <div class="banner">
                <div class="border border__top"></div>
                <div class="border border__left"></div>
                <div class="border border__right"></div>
                <div class="border border__bottom"></div>

                <!-- Banner content — edit below -->
                <div class="banner__inner hide" data-action="banner">
                    <div class="banner__wrapper">

                        <!-- Place your banner elements here -->

                    </div>

                    <!-- CTA button text -->
                    <div class="banner__cta"><span></span></div>
                </div>
                <!-- Banner content — edit above -->

            </div>
        </div>
    </div>

    <!-- GSAP and animation scripts — load order matters, do not rearrange -->
    <script src="./js/gsap.min.js"></script>
    <script src="./js/animation.js"></script>
    <script src="./js/static_html-scroll.js"></script>
</body>

</html>
